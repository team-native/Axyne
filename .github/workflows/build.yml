name: Build CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DAXYNE_AUTHOR=Native

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAXYNE_AUTHOR=Native

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build macOS
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel

      - name: Run CTest on Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run CTest on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: set +e; ctest --test-dir build --output-on-failure 2>&1 | tee mac-ctest.log; r=${PIPESTATUS[0]}; if [ $r -ne 0 ]; then grep -E 'FAIL|Assert|Exception|Segmentation|rror:' mac-ctest.log | head -8 | sed -e 's/%/%25/g' | while IFS= read -r l; do echo "::warning::$l"; done; fi; exit $r

      - name: Annotate failed tests
        if: failure()
        shell: bash
        run: |
          # Re-run only the failed tests and surface their output as check
          # annotations, so failures are readable without downloading logs.
          config=""
          if [ "$RUNNER_OS" = "Windows" ]; then config="--build-config Release"; fi
          ctest --test-dir build $config --rerun-failed --output-on-failure 2>&1 \
            | head -150 \
            | sed -e 's/%/%25/g' -e 's/\r//g' \
            | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path = "C:\Program Files (x86)\NSIS;$env:Path"
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw 'NSIS compiler was not installed.'
          }

      - name: Package Windows app output
        if: runner.os == 'Windows'
        id: package-windows
        run: |
          $stagingDirectory = Join-Path $env:RUNNER_TEMP 'Axyne-windows-install'
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'Axyne-windows-packages'
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'Axyne-windows-artifacts'
          New-Item -ItemType Directory -Force -Path $stagingDirectory, $packageDirectory, $artifactDirectory | Out-Null
          cmake --install build --config Release --prefix $stagingDirectory
          cmake `
            "-DAXYNE_INSTALL_ROOT=$stagingDirectory" `
            '-DAXYNE_PLATFORM=Windows' `
            '-DAXYNE_CONFIGURATION=Release' `
            -P packaging/validation/validate-install.cmake
          cpack --config build/CPackConfig.cmake -C Release -B $packageDirectory

          $debugStdout = Join-Path $env:RUNNER_TEMP 'axyne-cmake-debug.stdout.log'
          $debugStderr = Join-Path $env:RUNNER_TEMP 'axyne-cmake-debug.stderr.log'
          $debugProcess = Start-Process `
            -FilePath 'cmake' `
            -ArgumentList @('-DAXYNE_CONFIGURATION=Debug', '-DAXYNE_PLATFORM=Windows', '-DAXYNE_INSTALL_ROOT=unused', '-P', 'packaging/validation/validate-install.cmake') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $debugStdout `
            -RedirectStandardError $debugStderr
          $debugMessage = @(
            (Get-Content -Path $debugStdout -ErrorAction SilentlyContinue)
            (Get-Content -Path $debugStderr -ErrorAction SilentlyContinue)
          ) -join "`n"
          Write-Host $debugMessage
          if ($debugProcess.ExitCode -eq 0 -or $debugMessage -notmatch 'Release-only') {
            throw "Debug packaging validation failed unexpectedly:`n$debugMessage"
          }

          $package = Get-ChildItem -Path $packageDirectory -File |
            Where-Object { $_.Extension -eq '.exe' } |
            Select-Object -First 1
          if ($null -eq $package) {
            throw 'CPack did not produce a Windows installer.'
          }
          Copy-Item -LiteralPath $package.FullName -Destination $artifactDirectory
          "path=$artifactDirectory" >> $env:GITHUB_OUTPUT

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        id: package-macos
        shell: bash
        run: |
          staging_directory="$RUNNER_TEMP/Axyne-macos-install"
          package_directory="$RUNNER_TEMP/Axyne-macos-packages"
          artifact_directory="$RUNNER_TEMP/Axyne-macos-artifacts"
          mkdir -p "$staging_directory" "$package_directory" "$artifact_directory"
          cmake --install build --config Release --prefix "$staging_directory"
          cmake \
            -DAXYNE_INSTALL_ROOT="$staging_directory" \
            -DAXYNE_PLATFORM=macOS \
            -DAXYNE_CONFIGURATION=Release \
            -DAXYNE_APP_BUNDLE=Axyne.app \
            -DAXYNE_APP_EXECUTABLE=Axyne \
            -P packaging/validation/validate-install.cmake
          mkdir -p "$package_directory/dragndrop"
          pkgbuild \
            --root "$staging_directory" \
            --identifier com.axyne.ide \
            --version 0.1.0 \
            --install-location /Applications \
            "$package_directory/Axyne-0.1.0-macOS.pkg"
          package_payload="$(pkgutil --payload-files "$package_directory/Axyne-0.1.0-macOS.pkg")"
          if ! grep -q 'Axyne.app/' <<< "$package_payload"; then
            echo 'The macOS pkg has no Axyne.app payload.' >&2
            exit 1
          fi
          cpack --config build/CPackConfig.cmake -G DragNDrop -C Release \
            -D CPACK_PACKAGING_INSTALL_PREFIX=/ \
            -B "$package_directory/dragndrop"

          if cpack --config build/CPackConfig.cmake -G productbuild -C Debug -B "$package_directory/debug" >"$RUNNER_TEMP/axyne-cpack-debug.log" 2>&1; then
            echo 'Debug packaging unexpectedly succeeded.' >&2
            exit 1
          fi
          if ! grep -q 'Release-only' "$RUNNER_TEMP/axyne-cpack-debug.log"; then
            cat "$RUNNER_TEMP/axyne-cpack-debug.log" >&2
            echo 'Debug packaging failed for an unexpected reason.' >&2
            exit 1
          fi

          cp "$package_directory/Axyne-0.1.0-macOS.pkg" "$artifact_directory/"
          find "$package_directory/dragndrop" \
            -maxdepth 1 -type f -name '*.dmg' \
            -exec cp {} "$artifact_directory/" \;
          if ! find "$artifact_directory" -maxdepth 1 -type f \
            \( -name '*.pkg' -o -name '*.dmg' \) | grep -q .; then
            echo 'The macOS packaging step produced no artifacts.' >&2
            exit 1
          fi
          echo "path=$artifact_directory" >> "$GITHUB_OUTPUT"

      - name: Upload Windows build artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Axyne-windows-${{ github.sha }}
          path: ${{ steps.package-windows.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS build artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Axyne-macos-${{ github.sha }}
          path: ${{ steps.package-macos.outputs.path }}
          if-no-files-found: error
          retention-days: 14
